name: Build TWA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Bubblewrap
      run: npm install -g @bubblewrap/cli

    - name: Generate Keystore
      run: |
        keytool -genkeypair -v \
          -keystore android.keystore \
          -alias android \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=First Aid, O=Salah, C=YE"

    - name: Init TWA
      run: |
        bubblewrap init --manifest https://first-aid-ap.netlify.app/manifest.json --directory android-twa || true

    - name: Build APK
      run: |
        cd android-twa
        bubblewrap build || (chmod +x gradlew && ./gradlew assembleRelease)

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: first-aid-apk
        path: |
          android-twa/app/build/outputs/apk/**/*.apk
          android-twa/*.apk
        if-no-files-found: warn
