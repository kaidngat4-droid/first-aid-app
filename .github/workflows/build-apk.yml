name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: npx cap add android
      - name: Set app icon
        run: |
          sudo apt-get install -y imagemagick > /dev/null 2>&1 || true
          RES=android/app/src/main/res
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            mkdir -p $RES/mipmap-$n
            for name in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert assets/icon-only.png -resize ${s}x${s} $RES/mipmap-$n/$name.png
            done
          done
          rm -rf $RES/mipmap-anydpi-v26


      - name: Add permissions
        run: |
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>|' android/app/src/main/AndroidManifest.xml

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../first-aid.apk

      - uses: actions/upload-artifact@v4
        with:
          name: first-aid-apk
          path: first-aid.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: الإسعافات الأولية v1.0.${{ github.run_number }}
          files: first-aid.apk
